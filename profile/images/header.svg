<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360">
  <defs>
    <style>
      .t{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"D2Coding","Malgun Gothic","Apple SD Gothic Neo","DejaVu Sans Mono","Noto Sans CJK KR",monospace;font-size:20px}
      .p{fill:#22c55e;font-weight:700}.c{fill:#e6edf3}.o{fill:#8b949e}
      .g{fill:#f5b82e}.v{fill:#f472b6}.w{fill:#7dd3fc}
      .big{font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif;font-size:38px;font-weight:800;fill:#e6edf3}
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111a14"/>
    </linearGradient>
    <clipPath id="c1"><rect x="40" y="70" height="30" width="0"><animate attributeName="width" from="0" to="200" begin="0.4s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="40" y="150" height="30" width="0"><animate attributeName="width" from="0" to="240" begin="1.9s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="40" y="230" height="30" width="0"><animate attributeName="width" from="0" to="240" begin="3.4s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c6"><rect x="40" y="262" height="56" width="0"><animate attributeName="width" from="0" to="640" begin="4.3s" dur="1.1s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect x="1" y="1" width="998" height="358" rx="18" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <circle cx="28" cy="26" r="7" fill="#ff5f57"/><circle cx="52" cy="26" r="7" fill="#febc2e"/><circle cx="76" cy="26" r="7" fill="#28c840"/>
  <text x="500" y="31" text-anchor="middle" class="t o" style="font-size:15px">cit-code-academy — zsh</text>
  <line x1="2" y1="50" x2="998" y2="50" stroke="#30363d"/>

  <!-- 1 -->
  <text x="40" y="92" class="t" clip-path="url(#c1)"><tspan class="p">$ </tspan><tspan class="c">whoami</tspan></text>
  <!-- 2 -->
  <text x="40" y="124" class="t o" opacity="0">CIT-Code-Academy students · 직접 만들고, 직접 플레이합니다
    <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.2s" fill="freeze"/></text>
  <!-- 3 -->
  <text x="40" y="172" class="t" clip-path="url(#c3)"><tspan class="p">$ </tspan><tspan class="c">ls ~/works</tspan></text>
  <!-- 4 -->
  <text x="40" y="204" class="t" opacity="0"><tspan class="g">games/</tspan><tspan class="o">  (8)    </tspan><tspan class="v">vfx/</tspan><tspan class="o">  (2)    </tspan><tspan class="w">web/</tspan><tspan class="o">  (2)</tspan>
    <animate attributeName="opacity" from="0" to="1" begin="2.7s" dur="0.2s" fill="freeze"/></text>
  <!-- 5 -->
  <text x="40" y="252" class="t" clip-path="url(#c5)"><tspan class="p">$ </tspan><tspan class="c">echo $MOTTO</tspan></text>
  <!-- 6 -->
  <text x="40" y="304" class="big" clip-path="url(#c6)">학생들의 작업공간입니다 🌱</text>
  <!-- cursor -->
  <rect x="40" y="322" width="12" height="22" fill="#22c55e" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.5;0.51;1" begin="5.5s" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
